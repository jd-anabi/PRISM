[pytest]
testpaths = tests core/Reduction/tests
pythonpath = .
addopts = -ra
markers =
    slow: the long end-to-end tests (the chi full-pipeline test in tests/test_user_sbi.py and the FDT/crossval tiny-size run in tests/test_tool.py); excluded by the fast gate (pytest -m "not slow")
    gpu: needs CUDA; skipped when torch.cuda.is_available() is False
    display: needs a real screen; skipped under QT_QPA_PLATFORM=offscreen
